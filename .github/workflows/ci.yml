# Trunk-based: every commit on main is a deployable image.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  check:
    uses: 0xc0-labs/.github/.github/workflows/node-check.yml@main
  image:
    needs: check
    uses: 0xc0-labs/.github/.github/workflows/container-image.yml@main
