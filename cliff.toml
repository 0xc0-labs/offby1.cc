# git-cliff: the next version and the changelog, from the Conventional
# Commits since the last release. .github's release-candidate and release
# workflows read it, and force the tag pattern, the initial tag and the 0.x
# rule for breaking changes on their own, whatever this file says; they are
# here too so a local `git cliff` agrees with CI.

[changelog]
# The release workflow takes the body alone (`--strip all`).
header = ""
# One section per kind of change, in the order of the parsers below (the
# comment in each group name sorts them, and is stripped from the heading).
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{%- if commit.breaking and commit.breaking_description != commit.message %}
  {{ commit.breaking_description }}\
{%- endif %}
{%- endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
# Anything else (the repo's initial commit) is left out.
filter_unconventional = true
split_commits = false
# A breaking change is never dropped, whatever its type.
protect_breaking_commits = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^ci", group = "<!-- 5 -->CI" },
  { message = "^chore", group = "<!-- 6 -->Chores" },
  # test, build, style, revert, or any other type: listed, never skipped.
  { message = ".*", group = "<!-- 7 -->Other" },
]
filter_commits = false
# Only a release is the previous version, never an rc.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"

[bump]
# While in 0.x: a feat bumps the minor, and so does a breaking change; the
# rest bump the patch. From 1.0.0 on, a breaking change bumps the major.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
